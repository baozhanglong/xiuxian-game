<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>境界修炼 · 练气到大乘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23A23B2A'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23F1EEE3' font-family='serif'%3E境%3C/text%3E%3C/svg%3E">
<style>
  /* ===== 色板与字体：取自青绿山水的石青、石绿、赭墨，底色用宣纸 ===== */
  :root {
    --paper: #E7E3D6;
    --paper-card: #F2EFE4;
    --ink: #1F1D19;
    --ink-2: #5A554A;
    --ink-3: #8B8578;
    --line: #C7C1B0;
    --blue: #245E6B;
    --green: #4A6A4E;
    --cinnabar: #A23B2A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", SimSun, serif; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 18px 40px; }

  /* ===== 顶部状态条：道号 · 境界 · 灵石 ===== */
  .topbar {
    position: sticky; top: 0; z-index: 6;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 18px; background: var(--paper-card); border-bottom: 1px solid var(--line);
  }
  .topbar-left { min-width: 0; }
  .topbar-name {
    font-family: "Source Han Serif SC", "Songti SC", SimSun, serif;
    font-size: 15px; font-weight: 600; letter-spacing: .04em; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar-realm { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-top: 1px; }
  .topbar-stone { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .topbar-stone svg { width: 15px; height: 15px; stroke: var(--blue); fill: none; stroke-width: 1.6; }

  /* ===== 底部页面切换：图标 + 名字 ===== */
  .nav {
    position: sticky; bottom: 0; display: flex; margin-top: 18px;
    background: var(--paper); border-top: 1px solid var(--line); z-index: 5;
  }
  .nav-btn {
    flex: 1 1 0; min-width: 0; min-height: 58px; padding: 8px 2px 9px;
    background: var(--paper); border: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-family: inherit; font-size: 12px; color: var(--ink-3); cursor: pointer;
    letter-spacing: .04em; overflow: hidden;
  }
  .nav-icon { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .nav-btn:hover { color: var(--ink-2); }
  .nav-btn[data-active="true"] { color: var(--cinnabar); font-weight: 600; }

  /* 页面用 [hidden] 切换；容器自带 display 时用 !important 才能真的藏住 */
  [hidden] { display: none !important; }

  /* ===== 主体：单栏，宽屏限宽保证行长 ===== */
  .layout { margin-top: 18px; max-width: 760px; }

  .card { background: var(--paper-card); border: 1px solid var(--line); padding: 18px 16px; }
  @media (min-width: 640px) { .card { padding: 22px 20px; } }

  /* ===== 当前境界 ===== */
  .realm-name {
    font-family: "Source Han Serif SC", "Songti SC", SimSun, serif;
    font-size: 34px; font-weight: 600; letter-spacing: .05em; line-height: 1.3; margin: 2px 0 0;
    word-break: break-all;
  }
  .realm-count { font-size: 13px; color: var(--ink-2); margin-top: 2px; font-variant-numeric: tabular-nums; }

  .bar-block { margin-top: 18px; }
  .bar-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .bar-track { height: 10px; border: 1px solid var(--line); background: var(--paper); position: relative; }
  .bar-fill { height: 100%; width: 0; background: var(--blue); transition: width .25s linear; }
  .bar-note { font-size: 12px; color: var(--ink-2); margin-top: 6px; }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; margin-top: 20px; background: var(--line); border: 1px solid var(--line); }
  @media (min-width: 520px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat { background: var(--paper-card); padding: 10px 12px; min-width: 0; }
  .stat-k { font-size: 11px; color: var(--ink-3); letter-spacing: .1em; }
  .stat-v { font-size: 19px; font-variant-numeric: tabular-nums; margin-top: 1px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .btn {
    flex: 1 1 auto; min-height: 46px; padding: 11px 16px; font-family: inherit; font-size: 15px;
    cursor: pointer; border-radius: 0; border: 1px solid var(--ink); background: none; color: var(--ink);
    transition: background .15s, color .15s, opacity .15s;
  }
  .btn:hover:not(:disabled) { background: var(--ink); color: var(--paper-card); }
  .btn-primary { background: var(--cinnabar); border-color: var(--cinnabar); color: var(--paper-card); font-weight: 600; }
  .btn-primary:hover:not(:disabled) { background: #8C3123; border-color: #8C3123; color: var(--paper-card); }
  .btn:disabled { opacity: .38; cursor: not-allowed; }
  .btn-quiet { border-color: var(--line); color: var(--ink-2); font-size: 13px; min-height: 40px; flex: 0 0 auto; }
  .btn-quiet:hover { background: none; color: var(--ink); border-color: var(--ink-2); }

  .risk { font-size: 12px; color: var(--cinnabar); margin-top: 10px; min-height: 1px; }

  /* ===== 开局：取名、性别、灵根 ===== */
  .start { max-width: 640px; margin: 0 auto; }
  .start-kicker { font-size: 12px; letter-spacing: .2em; color: var(--ink-3); margin: 0; }
  .start-title { font-family: "Source Han Serif SC", "Songti SC", SimSun, serif; font-size: 27px; font-weight: 600; margin: 4px 0 0; letter-spacing: .05em; }
  .start-intro { font-size: 14px; color: var(--ink-2); margin: 8px 0 0; line-height: 1.7; }
  .field { margin-top: 20px; }
  .field-label { display: block; font-size: 12px; letter-spacing: .12em; color: var(--ink-3); margin-bottom: 7px; }
  .field input[type="text"] {
    width: 100%; min-height: 46px; padding: 10px 12px; font-size: 16px; font-family: inherit;
    color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 0;
  }
  .field input[type="text"]:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  .choice-row { display: flex; gap: 8px; }
  .choice {
    flex: 1 1 0; min-height: 44px; background: none; border: 1px solid var(--line);
    font-family: inherit; font-size: 14px; color: var(--ink-2); cursor: pointer; border-radius: 0;
  }
  .choice:hover { color: var(--ink); border-color: var(--ink-2); }
  .choice[data-selected="true"] { border-color: var(--cinnabar); color: var(--cinnabar); font-weight: 600; }

  .root-card { border: 1px solid var(--line); background: var(--paper-card); }
  .root-row { padding: 10px 12px; }
  .root-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 12px 12px; }
  .root-orbs-wrap { min-width: 0; }
  .root-orbs { display: flex; flex-wrap: wrap; gap: 10px; min-width: 0; }
  .root-orb-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .root-orb-score { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1; }
  .root-head-right { text-align: right; min-width: 0; flex: 0 0 auto; }
  .root-orb {
    flex: 0 0 auto; width: 27px; height: 27px; border-radius: 50%; border: 1px solid var(--ink);
    display: flex; align-items: center; justify-content: center; background: var(--paper);
    font-family: "Source Han Serif SC", "Songti SC", SimSun, serif;
    font-size: 14px; line-height: 1; color: var(--ink); letter-spacing: 0;
  }
  .root-orb[data-long="true"] { font-size: 10px; }
  .root-grade {
    display: block; font-family: "Source Han Serif SC", "Songti SC", SimSun, serif;
    font-size: 16px; font-weight: 600; letter-spacing: .1em; color: var(--ink);
  }
  .root-quality { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .root-quality b { font-size: 18px; color: var(--blue); font-weight: 600; }
  .root-bonus { font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); line-height: 1.7; font-variant-numeric: tabular-nums; }
  .root-actions { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .root-actions .btn { flex: 0 0 auto; padding: 9px 16px; min-height: 40px; }
  .root-rolls { font-size: 12px; color: var(--ink-3); }

  .start-btn { width: 100%; margin-top: 22px; }
  .start-note { font-size: 12px; color: var(--ink-3); margin: 10px 0 0; text-align: center; }

  /* ===== 功法阁 ===== */
  .tech-card { margin-top: 18px; max-width: 760px; }
  .tech-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .tech-head h2 { font-family: "Source Han Serif SC", "Songti SC", SimSun, serif; font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .06em; }
  .tech-hint { font-size: 12px; color: var(--ink-2); }
  .tier-tabs { display: flex; margin: 12px 0 14px; border-bottom: 1px solid var(--line); }
  .tier-tab {
    flex: 1 1 0; min-width: 0; background: none; border: none; border-bottom: 2px solid transparent;
    padding: 8px 6px 10px; font-family: inherit; font-size: 14px; color: var(--ink-2);
    cursor: pointer; min-height: 44px; line-height: 1.4;
  }
  .tier-tab:hover { color: var(--ink); }
  .tier-tab[data-active="true"] { color: var(--cinnabar); border-bottom-color: var(--cinnabar); font-weight: 600; }
  .tier-tab .tab-state { display: block; font-size: 11px; color: var(--ink-3); font-weight: 400; }
  .tier-tab[data-active="true"] .tab-state { color: var(--ink-2); }

  .tech-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 560px) { .tech-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 900px) { .tech-grid { grid-template-columns: repeat(4, 1fr); } }

  .tech { display: flex; flex-direction: column; gap: 5px; background: var(--paper-card); border: 1px solid var(--line); padding: 12px; min-width: 0; }
  .tech[data-locked="true"] { opacity: .5; }
  .tech[data-equipped="true"] { border-color: var(--cinnabar); background: rgba(162,59,42,.04); }
  .tech-tier { font-size: 11px; letter-spacing: .08em; color: var(--ink-3); }
  .tech-empty { grid-column: 1 / -1; padding: 18px 4px; font-size: 13px; color: var(--ink-3); }
  .tech-name { font-family: "Source Han Serif SC", "Songti SC", SimSun, serif; font-size: 16px; font-weight: 600; line-height: 1.35; word-break: break-all; }
  .tech-gain { font-size: 12px; color: var(--blue); font-variant-numeric: tabular-nums; }
  .tech-extra { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .tech-btn {
    margin-top: 8px; width: 100%; min-height: 40px; padding: 8px 10px; font-family: inherit; font-size: 13px;
    cursor: pointer; border-radius: 0; border: 1px solid var(--ink); background: none; color: var(--ink);
  }
  .tech-btn:hover:not(:disabled) { background: var(--ink); color: var(--paper-card); }
  .tech-btn:disabled { opacity: .4; cursor: not-allowed; }
  .tech-btn[data-default="true"] { border-color: var(--cinnabar); color: var(--cinnabar); }

  /* ===== 生平 ===== */
  .life-card { margin-top: 18px; max-width: 760px; }
  .life-summary { display: grid; grid-template-columns: 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 0 0 18px; }
  @media (min-width: 560px) { .life-summary { grid-template-columns: repeat(3, 1fr); } }
  .life-cell { background: var(--paper-card); padding: 10px 12px; min-width: 0; }
  .life-k { font-size: 11px; letter-spacing: .1em; color: var(--ink-3); }
  .life-v { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; word-break: break-all; }
  .life-list { border-top: 1px solid var(--line); }
  .life-item { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 11px 0; border-bottom: 1px solid rgba(199,193,176,.5); }
  .life-time { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .life-text { font-size: 14px; color: var(--ink-2); line-height: 1.6; }
  .life-item[data-kind="start"] .life-text { color: var(--ink); font-weight: 600; }
  .life-item[data-kind="good"] .life-text { color: var(--green); }
  .life-item[data-kind="bad"] .life-text { color: var(--cinnabar); }
  .life-empty { padding: 16px 0; font-size: 13px; color: var(--ink-3); }

  /* ===== 历练：三十层副本逐条列 ===== */
  .dungeon-grid { display: flex; flex-direction: column; margin-top: 14px; }
  .dungeon-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .dungeon-row:last-child { border-bottom: none; }
  .dungeon-left { min-width: 0; }
  .dungeon-name {
    font-family: "Source Han Serif SC", "Songti SC", SimSun, serif;
    font-size: 15px; font-weight: 600; letter-spacing: .04em;
  }
  .dungeon-meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .dungeon-btn {
    flex: 0 0 auto; min-width: 64px; min-height: 36px; padding: 6px 14px;
    font-family: inherit; font-size: 13px; cursor: pointer;
    border: 1px solid var(--ink); background: none; color: var(--ink); border-radius: 0;
  }
  .dungeon-btn:hover:not(:disabled) { background: var(--ink); color: var(--paper-card); }
  .dungeon-btn:disabled { opacity: .4; cursor: not-allowed; border-color: var(--line); color: var(--ink-3); }

  /* ===== 商店 / 丹药 / 轮回 ===== */
  .shop-card { margin-top: 18px; max-width: 760px; }
  .stone-line { font-size: 13px; color: var(--ink-2); margin: 0 0 14px; }
  .stone-line b { font-family: "Source Han Serif SC", "Songti SC", SimSun, serif; font-size: 20px; color: var(--blue); font-variant-numeric: tabular-nums; }
  /* ===== 洞府门户：两列卡片，看图就能点进去 ===== */
  .back-link {
    background: none; border: none; padding: 0 0 12px; margin: 0;
    font-family: inherit; font-size: 12px; color: var(--ink-3); cursor: pointer; letter-spacing: .06em;
  }
  .back-link:hover { color: var(--cinnabar); }
  .cave-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 560px) { .cave-grid { grid-template-columns: repeat(3, 1fr); } }
  .cave-card {
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    padding: 18px 10px 16px; background: var(--paper-card); border: 1px solid var(--line);
    font-family: inherit; color: var(--ink); cursor: pointer; min-width: 0;
  }
  .cave-card:hover { border-color: var(--ink-2); }
  .cave-icon {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    background: rgba(36, 94, 107, .08); border: 1px solid var(--line);
  }
  .cave-icon svg { width: 22px; height: 22px; stroke: var(--blue); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .cave-name {
    font-family: "Source Han Serif SC", "Songti SC", SimSun, serif;
    font-size: 15px; font-weight: 600; letter-spacing: .06em;
  }
  .cave-meta { font-size: 12px; color: var(--ink-3); text-align: center; line-height: 1.5; }
  .cave-meta[data-tone="active"] { color: var(--cinnabar); }
  .cave-meta[data-tone="done"] { color: var(--green); }

  /* ===== 道侣：候选人各一张卡 ===== */
  .partner-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
  @media (min-width: 560px) { .partner-grid { grid-template-columns: repeat(3, 1fr); } }
  /* ===== 背包：上分段页签，下三列卡格 ===== */
  .bag-tabs {
    display: flex; gap: 2px; padding: 3px; margin: 0 0 14px;
    background: var(--paper-card); border: 1px solid var(--line);
  }
  .bag-tab {
    flex: 1 1 0; min-width: 0; min-height: 38px; padding: 6px 4px;
    background: none; border: none; font-family: inherit; font-size: 14px;
    color: var(--ink-2); cursor: pointer; letter-spacing: .06em;
  }
  .bag-tab[data-active="true"] { background: var(--ink); color: var(--paper-card); font-weight: 600; }
  .bag-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (min-width: 640px) { .bag-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; } }
  .bag-card {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 6px 0; min-height: 96px; min-width: 0;
    background: var(--paper-card); border: 1px solid var(--line);
    font-family: inherit; text-align: center; color: var(--ink);
    cursor: pointer; position: relative;
  }
  .bag-card:disabled { cursor: default; }
  .bag-card[data-empty="true"] { opacity: .5; }
  .bag-card-top { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
  .bag-card-icon svg {
    width: 20px; height: 20px; stroke: var(--ink-2); stroke-width: 1.3;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .bag-card-top[data-rarity] { font-weight: 600; }
  .bag-card-name { font-size: 13px; font-weight: 600; line-height: 1.35; word-break: break-all; }
  .bag-card-sub { font-size: 11px; color: var(--ink-3); line-height: 1.4; }
  .bag-card-foot {
    width: 100%; margin-top: auto; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--ink-2); padding: 6px 2px; letter-spacing: .04em;
  }
  .bag-card-foot[data-on="true"] { color: var(--cinnabar); font-weight: 600; }
  .bag-scene { position: relative; border: 1px solid var(--line); margin-bottom: 14px; overflow: hidden; }
  .bag-scene[hidden] { display: none; }
  .bag-scene svg { display: block; width: 100%; height: 150px; }
  .bag-scene-info {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
    gap: 4px; padding: 14px 16px; pointer-events: none;
  }
  .bag-scene-k { font-size: 12px; letter-spacing: .18em; color: var(--ink-2); }
  .bag-scene-v { font-size: 14px; font-weight: 600; color: var(--ink); }
  .bag-section-title {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin: 18px 0 10px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .bag-section-title b { font-size: 15px; font-weight: 600; letter-spacing: .06em; }
  .bag-section-title span { font-size: 12px; color: var(--ink-3); }
  .bag-actions { display: flex; gap: 8px; margin-top: 12px; }
  .bag-actions .btn { flex: 1 1 auto; min-height: 40px; }

  .slot-title { font-size: 13px; color: var(--ink-2); letter-spacing: .08em; margin: 18px 0 8px; }

  /* 品级着色：白→金由素到贵，跟游戏里的约定一致 */
  .pill-name[data-rarity="white"] { color: var(--ink-2); }
  .pill-name[data-rarity="green"] { color: var(--green); }
  .pill-name[data-rarity="blue"] { color: var(--blue); }
  .pill-name[data-rarity="purple"] { color: #6B4E7A; }
  .pill-name[data-rarity="red"] { color: var(--cinnabar); }
  .pill-name[data-rarity="gold"] { color: #9A742C; }
  .bag-card-name[data-rarity="white"], .bag-card-top[data-rarity="white"] { color: #A29C8C; }
  .bag-card-name[data-rarity="green"] { color: var(--green); }
  .bag-card-name[data-rarity="blue"] { color: var(--blue); }
  .bag-card-name[data-rarity="purple"] { color: #6B4E7A; }
  .bag-card-name[data-rarity="red"] { color: var(--cinnabar); }
  .bag-card-name[data-rarity="gold"] { color: #9A742C; }

  /* ===== 人物页：属性清单，左名右值 ===== */
  .attr-list { display: flex; flex-direction: column; }
  .attr-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .attr-row:last-child { border-bottom: none; padding-bottom: 0; }
  .attr-k { font-size: 13px; color: var(--ink-2); flex: 0 0 auto; letter-spacing: .06em; }
  .attr-v { font-size: 15px; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; word-break: break-all; }
  .attr-v[data-tone="accent"] { color: var(--blue); font-weight: 600; }
  .attr-v[data-tone="good"] { color: var(--green); }

// 每阶的数值按阶数平方往上抬，再乘品级倍率；各部位倾向不同，攻、防、血各有轻重
function equipStatBase(slotKey, tier) {
  const base = tier * tier;
  if (slotKey === "weapon") return { atk: 10 * tier + base, def: 0, hp: 0 };
  if (slotKey === "helmet") return { atk: 0, def: 6 * tier + base * 0.6, hp: 30 * tier + 2 * base };
  if (slotKey === "armor") return { atk: 0, def: 8 * tier + base, hp: 40 * tier + 4 * base };
  if (slotKey === "bracer") return { atk: 4 * tier, def: 4 * tier + base * 0.4, hp: 20 * tier + 1.5 * base };
  if (slotKey === "boots") return { atk: 0, def: 4 * tier + base * 0.5, hp: 30 * tier + 3 * base };
  if (slotKey === "necklace") return { atk: 5 * tier, def: 0, hp: 20 * tier + 2 * base };
  return { atk: 5 * tier, def: 3 * tier, hp: 15 * tier + 1.5 * base };
}

function buildEquipTier(slotKey, tier, rarity) {
  const row = EQUIP_SLOT_TABLE.find((item) => item.key === slotKey);
  const raw = equipStatBase(slotKey, tier);
  const mult = rarity.mult;
  return {
    id: slotKey + "-" + tier + "-" + rarity.key,
    name: EQUIP_TIER_NAMES[tier - 1] + (row ? row.suffix : ""),
    slot: slotKey,
    tier,
    rarity: rarity.key,
    rarityName: rarity.name,
    atk: Math.round(raw.atk * mult),
    def: Math.round(raw.def * mult),
    hp: Math.round(raw.hp * mult)
  };
}

   三、把配置展开成一维境界链：每个境界的每一重都是数组里的一项
   好处：判断“下一重是谁”只要 index + 1，不用写几十个 if
   ========================================================================= */
function buildStages(table) {
  const stages = [];
  table.forEach((realm) => {
    realm.stages.forEach((suffix, stageIndex) => {
      const isLastOfRealm = stageIndex === realm.stages.length - 1;
      const isEnd = realm.needStart === null || (realm.lastStageIsEnd && isLastOfRealm);
      stages.push({
        id: stages.length,
        realm: realm.name,
        name: realm.name + suffix,
        need: isEnd ? null : Math.round(realm.needStart * Math.pow(realm.growth, stageIndex)),
        rate: Math.max(realm.minRate, realm.rateStart - realm.rateDecay * stageIndex),
        lossRatio: realm.lossRatio,
        bonus: realm.bonus,
        gainPerSec: realm.gainPerSec,
        isTrial: Boolean(realm.isTrial),
        fallbackStages: realm.fallbackStages || 0
      });
    });
  });
  return stages;
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (typeof parsed.stage !== "number" || parsed.stage < 0) return null;
    const merged = Object.assign(createInitialState(), parsed, {
      log: parsed.log || [],
      history: Array.isArray(parsed.history) ? parsed.history : []
    });
    if (typeof merged.startedAt !== "number") merged.startedAt = 0;
    // 老存档没有生平记录时保持空表，页面上给出说明，不伪造日期
    if (!merged.pills || typeof merged.pills !== "object") merged.pills = {};
    if (typeof merged.breakBonus !== "number") merged.breakBonus = 0;
    if (typeof merged.speedUntil !== "number") merged.speedUntil = 0;
    if (typeof merged.rebirths !== "number") merged.rebirths = 0;
    // 老存档没有道侣字段，或存的是已不存在的 id，都按未结缘处理
    // 支持多道侣：老存档的字符串转为数组，新存档直接是数组
    if (Array.isArray(merged.partner)) {
      merged.partner = merged.partner.filter((id) => PARTNERS[id]);
    } else if (typeof merged.partner === "string" && PARTNERS[merged.partner]) {
      merged.partner = [merged.partner];
    } else {
      merged.partner = [];
    }
    // 法宝与装备同样兜底：只认配置表里还存在的 id，旧存档缺字段就当没买过
    merged.treasures = Array.isArray(merged.treasures)
      ? merged.treasures.filter((id) => TREASURES[id])
      : [];
    if (!TREASURES[merged.treasureId]) merged.treasureId = null;
    merged.equips = Array.isArray(merged.equips)
      ? merged.equips.filter((id) => {
        const slot = String(id).split("-")[0];
        return equipItemById(slot, id) !== null;
      })
      : [];
    merged.cleared = Array.isArray(merged.cleared) ? merged.cleared : [];
    const equipIds = merged.equipIds && typeof merged.equipIds === "object" ? merged.equipIds : {};
    const cleanEquipIds = {};
    EQUIP_SLOT_ORDER.forEach((slot) => {
      const id = equipIds[slot];
      const owned = equipItemById(slot, id);
      // 没打到过的装备不能凭空穿上；同一只戒指不许同时占两只手
      const dupRing = owned && owned.slot === "ring"
        && EQUIP_SLOT_ORDER.some((other) => other !== slot && cleanEquipIds[other] === id);
      cleanEquipIds[slot] = owned && !dupRing && merged.equips.indexOf(id) >= 0 ? id : null;
    });
    merged.equipIds = cleanEquipIds;
    // 老存档没有 started 字段，有进度就说明早在玩了，不要把他打回开局页
    if (typeof parsed.started !== "boolean") merged.started = true;
    // 老存档没有灵根资质，补一个 50 分；灵根格式对不上（旧版的单属性字段）就重抽一副
    if (typeof parsed.rootQuality !== "number") merged.rootQuality = 50;
    if (!Array.isArray(merged.rootElements) || merged.rootElements.length === 0) {
      const roll = pickRootRoll();
      merged.rootElements = roll.elements;
      merged.rootQuality = roll.quality;
    } else {
      // 上一版存的是纯字符串数组，补成“属性 + 各自资质”的形式
      merged.rootElements = merged.rootElements.map((item) => (
        typeof item === "string"
          ? { key: item, quality: merged.rootQuality || 50 }
          : item
      ));
    }
    return merged;
  } catch (error) {
    // 存档坏了就当没存档，不要让整个游戏打不开
    console.error("读取存档失败", error);
    return null;
  }
}

  const tech = TECHS.find((item) => item.id === state.techId);
  if (!tech) return null;
  return rootElements().map(elementKey).includes(tech.element) ? tech : null;
}

// 功法加成。没有主修时返回全 0，这样下面的计算不用到处判空
function techBonus() {
  const tech = activeTech();
  if (!tech) return { gain: 0, atk: 0, def: 0, hp: 0, rate: 0 };
  return tech;
}

// 当前灵根由哪些属性组成，每项形如 { key: "水", quality: 72 }
function rootElements() {
  return Array.isArray(state.rootElements) ? state.rootElements : [];
}

function elementKey(item) {
  return typeof item === "string" ? item : item.key;
}

// 品阶由组合推出来：含混沌=混沌灵根，含变异=变异灵根，纯五行按个数定级
function rootGrade(list) {
  const elements = list || rootElements();
  if (elements.length === 0) return "";
  const keys = elements.map(elementKey);
  if (keys.includes("混沌")) return "混沌灵根";
  if (keys.some((key) => VARIANT_ELEMENTS.includes(key))) return "变异灵根";
  const gradeByCount = ["天灵根", "双灵根", "三灵根", "四灵根", "杂灵根"];
  return gradeByCount[Math.min(keys.length, 5) - 1];
}

// 每个属性各有自己的资质，取平均作为整副灵根的资质
function rootAverageQuality() {
  const elements = rootElements();
  if (elements.length === 0) return Math.max(1, state.rootQuality || 1);
  const total = elements.reduce((sum, item) => sum + (typeof item === "string" ? state.rootQuality : item.quality), 0);
  return total / elements.length;
}

// 资质换算成修行速度倍率：资质 ÷ 20，100 分 = 5.0 倍
function rootPoints() {
  return Math.max(1, rootAverageQuality()) / QUALITY_PER_SPEED;
}

// 属性偏向取组成属性的平均值：单属性最极端，五属性趋于均衡
function rootMuls() {
  const elements = rootElements();
  if (elements.length === 0) return { atkMul: 1, defMul: 1, hpMul: 1 };

  const sum = elements.reduce((acc, item) => {
    const mul = ELEMENTS[elementKey(item)];
    return { atk: acc.atk + mul.atk, def: acc.def + mul.def, hp: acc.hp + mul.hp };
  }, { atk: 0, def: 0, hp: 0 });

  return {
    atkMul: sum.atk / elements.length,
    defMul: sum.def / elements.length,
    hpMul: sum.hp / elements.length
  };
}

// 三项属性同样用乘法：元素偏向 × 资质系数（资质 ÷ 50，50 分即原样 1.0 倍）
function rootAttrMuls() {
  const muls = rootMuls();
  const qualityScale = Math.max(1, rootAverageQuality()) / QUALITY_PER_ATTR;
  return {
    atk: muls.atkMul * qualityScale,
    def: muls.defMul * qualityScale,
    hp: muls.hpMul * qualityScale
  };
}

function equipBonus() {
  const total = { atk: 0, def: 0, hp: 0 };
  EQUIP_SLOT_ORDER.forEach((slot) => {
    const item = equipItemById(slot, state.equipIds[slot]);
    if (!item) return;
    EQUIP_BONUS_FIELDS.forEach((field) => {
      total[field] += item[field] || 0;
    });
  });
  return total;
}

// 法宝与装备的加成汇总：表格里配多少就加多少，逻辑里不写死数字
function gearBonus() {
  const total = { atk: 0, def: 0, hp: 0 };
  const treasure = TREASURES[state.treasureId];
  const pieces = [];
  if (treasure) pieces.push(treasure);
  EQUIP_SLOT_ORDER.forEach((slot) => {
    const item = equipItemById(slot, state.equipIds[slot]);
    if (item) pieces.push(item);
  });
  pieces.forEach((piece) => {
    EQUIP_BONUS_FIELDS.forEach((field) => {
      total[field] += piece[field] || 0;
    });
  });
  return total;
}

function equipItemById(slot, id) {
  if (!id) return null;
  const pool = EQUIPMENTS[EQUIP_POOL_BY_SLOT[slot] || slot] || [];
  return pool.find((item) => item.id === id) || null;
}

function totalAttack() {
  return (state.attack + techBonus().atk + gearBonus().atk) * rootAttrMuls().atk;
}

function totalDefense() {
  return (state.defense + techBonus().def + gearBonus().def) * rootAttrMuls().def;
}

function totalHp() {
  return (state.hp + techBonus().hp + gearBonus().hp) * rootAttrMuls().hp;
}

// 五维：攻击与防御照旧，速度、暴击、气运由境界、灵根、装备各自折算
function playerStats() {
  const stage = currentStage();
  const rootAvg = rootAverageQuality();
  const weapon = equipItemById("weapon", state.equipIds.weapon);
  const boots = equipItemById("boots", state.equipIds.boots);
  const hasChaos = rootElements().some((item) => item.key === "混沌");
  const hasVariant = rootElements().some((item) => VARIANT_ELEMENTS.indexOf(item.key) >= 0);

  const speed = BASE_SPEED + state.stage * SPEED_PER_STAGE
    + Math.round(rootPoints() * SPEED_PER_ROOT)
    + (boots ? boots.tier * SPEED_PER_BOOT_TIER : 0);

  let crit = BASE_CRIT + (weapon ? weapon.tier * CRIT_PER_WEAPON_TIER : 0);
  if (hasChaos) crit += CHAOS_CRIT_BONUS;
  else if (hasVariant) crit += VARIANT_CRIT_BONUS;
  crit = Math.min(CRIT_CAP, crit);

  const luck = BASE_LUCK + state.rebirths * LUCK_PER_REBIRTH
    + Math.round(rootAvg * LUCK_PER_QUALITY);

  return { atk: totalAttack(), def: totalDefense(), speed, crit, luck };
}

// 气运与暴击在别处也要用，抽出来免得两处口径不一致
function critChance() {
  return playerStats().crit / PERCENT;
}

function luckFactor() {
  return playerStats().luck;
}

// 打坐速度 = 境界基础速度 × 灵根倍率 ×（1 + 功法加成）×（1 + 轮回加成）×（1 + 道侣加成）× 丹药倍率
function gainPerSecond() {
  return currentStage().gainPerSec * rootPoints() * (1 + techBonus().gain)
    * (1 + state.rebirths * REBIRTH_BONUS_PER_LIFE) * (1 + partnerRate()) * speedBuffMultiplier();
}

// 多道侣累加：未结缘就是 0，加成按配置表累加
function partnerRate() {
  if (!Array.isArray(state.partner)) return 0;
  let total = 0;
  state.partner.forEach((id) => {
    if (PARTNERS[id]) total += PARTNERS[id].rate;
  });
  return total;
}

// 悟道丹还在有效期内就 ×2，否则 ×1
function speedBuffMultiplier() {
  return Date.now() < state.speedUntil ? SPEED_BUFF_MULT : 1;
}

// 实际突破成功率 = 境界基础成功率 + 功法加成 + 破境丹 + 气运带来的些许顺遂
function effectiveRate() {
  const raw = currentStage().rate + techBonus().rate + state.breakBonus + luckFactor() * LUCK_TO_RATE;
  return Math.min(0.99, Math.max(0.01, raw));
}

function formatRatePerSecond(value) {
  return Number.isInteger(value) ? String(value) : value.toFixed(1);
}

function formatNumber(value) {
  return Math.floor(value).toLocaleString("zh-CN");
}

// 气运这类小数属性：整数就干写，有小数才带一位
function stripTrailingZeros(value) {
  const rounded = Math.round(value * 10) / 10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

function formatPercent(ratio) {
  return Math.round(ratio * PERCENT) + "%";
}

function addLog(text, kind) {
  state.log.unshift({ text, kind: kind || "info", at: Date.now() });
  state.log = state.log.slice(0, LOG_LIMIT);
}

// 生平：只记值得写进传记的事（入道、突破成败），时间用毫秒时间戳存
function addHistory(text, kind) {
  state.history.unshift({ text, kind: kind || "info", at: Date.now() });
  state.history = state.history.slice(0, HISTORY_LIMIT);
}

let toastTimer = null;
function showToast(message) {
  el.toast.textContent = message;
  el.toast.dataset.show = "true";
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => {
    el.toast.dataset.show = "false";
  }, 2200);
}

/* =========================================================================
   七、渲染：只负责把 state 画到屏幕上，不修改任何游戏数据
   ========================================================================= */
function render() {
  const stage = currentStage();

  el.realmName.textContent = stage.name;
  el.realmCount.textContent = "第 " + (state.stage + 1) + " 重 / 共 " + STAGES.length + " 重";

  // 顶部状态条与卡片同步更新
  el.topName.textContent = state.name;
  el.topRealm.textContent = stage.name + " · 第 " + (state.stage + 1) + "/" + STAGES.length + " 重";
  el.topStone.textContent = formatNumber(state.stones);

  const tech = activeTech();
  el.techLine.textContent = tech
    ? "主修功法：" + tech.name + "（" + tech.tier + "阶" + tech.grade + "）"
    : "主修功法：尚未参悟";

  const rootList = rootElements();
  el.playerLine.textContent = state.started
    ? "道号：" + state.name + " · " + state.gender + " · "
      + (rootList.length > 0
        ? rootGrade() + "（" + rootList.map(elementKey).join("、") + "）· 资质 " + Math.round(rootAverageQuality())
        : "灵根未定")
    : "道号：尚未入道";

  const need = stage.need;
  if (need === null) {
    el.cultText.textContent = formatNumber(state.cultivation) + " / 已至绝顶";
    el.barFill.style.width = "100%";
    el.barTrack.setAttribute("aria-valuenow", "100");
    el.gainNote.textContent = "已是大乘，此界再无可破之境（每秒 +" + formatRatePerSecond(gainPerSecond()) + " 修为）";
    el.riskNote.textContent = "";
    el.breakBtn.textContent = "已在最高境界";
    el.breakBtn.disabled = true;
  } else {
    const ratio = Math.min(1, state.cultivation / need);
    el.cultText.textContent = formatNumber(state.cultivation) + " / " + formatNumber(need);
    el.barFill.style.width = (ratio * PERCENT).toFixed(1) + "%";
    el.barTrack.setAttribute("aria-valuenow", String(Math.round(ratio * PERCENT)));
    el.gainNote.textContent = state.meditating
      ? "打坐中：每秒 +" + formatRatePerSecond(gainPerSecond()) + " 修为"
        + (tech ? "（功法 +" + formatPercent(tech.gain) + "）" : "")
      : "已停止打坐，点“开始打坐”继续积累";
    const riskText = stage.isTrial
      ? "天劫凶险：失败将跌落至" + STAGES[Math.max(0, state.stage - stage.fallbackStages)].name
      : (stage.lossRatio > 0
        ? "突破失败将损失 " + formatPercent(stage.lossRatio) + " 修为"
        : "");
    const bonusNotes = [];
    if (tech && tech.rate > 0) bonusNotes.push("功法加持 成功率 +" + formatPercent(tech.rate));
    if (state.breakBonus > 0) bonusNotes.push("破境丹 成功率 +" + formatPercent(state.breakBonus));
    el.riskNote.textContent = riskText + (bonusNotes.length > 0 ? "｜" + bonusNotes.join("｜") : "");

    if (state.cultivation >= need) {
      el.breakBtn.textContent = "尝试突破 · 成功率 " + formatPercent(effectiveRate());
      el.breakBtn.disabled = false;
    } else {
      el.breakBtn.textContent = "尚需 " + formatNumber(need - state.cultivation) + " 修为";
      el.breakBtn.disabled = true;
    }
  }

  el.meditateBtn.textContent = state.meditating ? "停止打坐" : "开始打坐";
  el.atk.textContent = formatNumber(totalAttack());
  el.def.textContent = formatNumber(totalDefense());
  el.hp.textContent = formatNumber(totalHp());
  el.stone.textContent = formatNumber(state.stones);

  renderTechs();
  // 当前显示的页面要跟着状态刷新；不可见的页面不去动它，省得白重绘
  if (!VIEWS.history.hidden) renderDungeon();
  if (!VIEWS.shop.hidden) refreshShopButtons();
  if (!VIEWS.rebirth.hidden) renderRebirth();
  if (!VIEWS.cave.hidden) renderCave();
  if (!VIEWS.attr.hidden) renderAttr();
}

// 历练页：三十层副本，第 N 层掉 1~N 阶装备
function dungeonStageIndex(dungeonTier) {
  // 把 1~30 层平摊到 0~19 重境界上：越深的副本要求越高的境界
  return Math.round((dungeonTier - 1) * LAST_STAGE_ID / (DUNGEON_COUNT - 1));
}

function dungeonMinStage(dungeonTier) {
  return dungeonStageIndex(dungeonTier);
}

// 该层对应的“参考战力”：按那一重境界的累计攻防血折算，副本强度就锚在境界上
function dungeonPowerNeed(dungeonTier) {
  const stageIndex = dungeonStageIndex(dungeonTier);
  let atk = BASE_ATTACK;
  let def = BASE_DEFENSE;
  let hp = BASE_HP;
  for (let i = 0; i < stageIndex; i += 1) {
    atk += STAGES[i].bonus.atk;
    def += STAGES[i].bonus.def;
    hp += STAGES[i].bonus.hp;
  }
  return Math.round(atk + def * 0.6 + hp * 0.15);
}

function playerPower() {
  return totalAttack() + totalDefense() * 0.6 + totalHp() * 0.15;
}

function dungeonTierLabel(tier) {
  const nums = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
  if (tier <= 10) return nums[tier - 1] + "阶";
  if (tier < 20) return "十" + nums[tier - 11] + "阶";
  if (tier === 20) return "二十阶";
  if (tier < 30) return "二十" + nums[tier - 21] + "阶";
  return "三十阶";
}

function renderDungeon() {
  const renderKey = state.stage + "|" + state.cleared.length + "|" + state.stones;
  if (ui.dungeonKey === renderKey) return;
  ui.dungeonKey = renderKey;

  renderLifeCellRow(el.dungeonSummary, [
    { k: "已破副本", v: state.cleared.length + " / " + DUNGEON_COUNT },
    { k: "当前战力", v: formatNumber(playerPower()) },
    { k: "囊中灵石", v: formatNumber(state.stones) }
  ]);

  el.dungeonGrid.innerHTML = "";
  for (let tier = 1; tier <= DUNGEON_COUNT; tier += 1) {
    const minStage = dungeonMinStage(tier);
    const locked = state.stage < minStage;
    const cleared = state.cleared.indexOf(tier) >= 0;

    const row = document.createElement("div");
    row.className = "dungeon-row";

    const left = document.createElement("div");
    left.className = "dungeon-left";

    const name = document.createElement("div");
    name.className = "dungeon-name";
    name.textContent = "第 " + tier + " 层" + (cleared ? " · 已破" : "");

    const meta = document.createElement("div");
    meta.className = "dungeon-meta";
    meta.textContent = "掉落 1~" + tier + " 阶装备 · 需 " + STAGES[minStage].name;

    left.appendChild(name);
    left.appendChild(meta);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "dungeon-btn";
    if (locked) {
      btn.textContent = "未可入";
      btn.disabled = true;
    } else {
      btn.textContent = "入内";
      btn.addEventListener("click", () => enterDungeon(tier));
    }

    row.appendChild(left);
    row.appendChild(btn);
    el.dungeonGrid.appendChild(row);
  }
}

// 品级越稀有权重越小，抽装备时按权重抽，金装最难出
function pickWeightedPiece(pool) {
  if (pool.length === 0) return null;
  let total = 0;
  pool.forEach((piece) => {
    total += RARITY_BY_KEY[piece.rarity].weight;
  });
  let roll = Math.random() * total;
  for (let i = 0; i < pool.length; i += 1) {
    roll -= RARITY_BY_KEY[pool[i].rarity].weight;
    if (roll <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

// 闯副本：按战力与所需战力的比值定胜负，赢了掉一件还没到手的装备
function enterDungeon(tier) {
  if (state.stage < dungeonMinStage(tier)) {
    showToast("境界不足，先修炼到 " + STAGES[dungeonMinStage(tier)].name);
    return;
  }

  const need = dungeonPowerNeed(tier);
  const power = playerPower();
  const stats = playerStats();
  // 胜率由战力比打底，暴击与速度再各添一点：手快、出手狠的就更容易拿下
  const winChance = Math.min(0.95, Math.max(0.12,
    power / need * 0.75 + stats.crit / 200 + (stats.speed - BASE_SPEED) * 0.002));
  const win = Math.random() < winChance;

  if (!win) {
    el.dungeonResult.textContent = "闯第 " + tier + " 层失利：此处妖物凶悍（需战力 "
      + formatNumber(need) + "，你为 " + formatNumber(power) + "），且先退回修炼。";
    addHistory("闯入第 " + tier + " 层，力有不逮，负伤而退。", "bad");
    saveState();
    showToast("第 " + tier + " 层失手");
    return;
  }

  if (state.cleared.indexOf(tier) < 0) state.cleared.push(tier);
  const rewardStones = DUNGEON_STONE_BASE + tier * DUNGEON_STONE_PER_TIER;
  state.stones += rewardStones;

  // 只掉还没到手的货色：先抽阶数（1~N），再按品级权重抽
  let picked = null;
  const tierRoll = randomInt(1, tier);
  const lowestPool = [];
  EQUIP_ITEM_SLOTS.forEach((slotKey) => {
    EQUIPMENTS[slotKey].forEach((piece) => {
      if (state.equips.indexOf(piece.id) >= 0) return;
      if (piece.tier === tierRoll) lowestPool.push(piece);
    });
  });
  picked = pickWeightedPiece(lowestPool);
  if (!picked) {
    const anyPool = [];
    EQUIP_ITEM_SLOTS.forEach((slotKey) => {
      EQUIPMENTS[slotKey].forEach((piece) => {
        if (piece.tier <= tier && state.equips.indexOf(piece.id) < 0) anyPool.push(piece);
      });
    });
    picked = pickWeightedPiece(anyPool);
  }

  let dropText = "此层已无可取之物，只得灵石 " + rewardStones + "。";
  if (picked && state.equips.length >= BAG_CAPACITY) {
    // 背包满了，新装备不占格，直接化尘折算灵石
    const dust = DUST_STONE_BASE + picked.tier * DUST_STONE_PER_TIER;
    state.stones += dust;
    dropText = "背包已满，" + picked.name + "（" + picked.rarityName + "）化作器灵尘，折灵石 " + dust + "；另得灵石 " + rewardStones + "。";
    picked = null;
  }
  if (picked) {
    state.equips.push(picked.id);
    dropText = "得" + picked.name + "（" + picked.rarityName + " · " + dungeonTierLabel(picked.tier)
      + " · " + EQUIP_SLOTS[EQUIP_POOL_BY_SLOT[picked.slot]] + "，" + bonusText(picked) + "），另得灵石 " + rewardStones + "。";
  }

  el.dungeonResult.textContent = "破了第 " + tier + " 层。" + dropText;
  addHistory("破第 " + tier + " 层副本。" + dropText, "good");
  saveState();
  showToast("破了第 " + tier + " 层");
  ui.dungeonKey = "";
  renderDungeon();
  renderBag();
  render();
}

// 生平里的时间要写清楚年月日与时分，只记时辰看不出是哪天
function formatDateTime(timestamp) {
  const date = new Date(timestamp);
  const pad = (value) => String(value).padStart(2, "0");
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate())
    + " " + pad(date.getHours()) + ":" + pad(date.getMinutes());
}

// 图标是固定常量串，不带任何用户数据，直接拼进 SVG 容器即可

function caveMetaText(entry) {

  }
  if (entry.view === "partner") {
    const bondedList = Array.isArray(state.partner) ? state.partner : [];
    const bonded = bondedList.length;
    return bonded > 0
      ? bondedList.map((id) => PARTNERS[id] ? PARTNERS[id].name : "").filter(Boolean).join("、") + " · 修行 ×" + (1 + partnerRate()).toFixed(2)
      : "尚未结缘";
  }
  if (entry.view === "bag") {
    const worn = EQUIP_SLOT_ORDER.filter((slot) => state.equipIds[slot]).length;
    return "装备 " + state.equips.length + " 件 · 丹药 "
      + PILL_ORDER.reduce((sum, pillId) => sum + pillCount(pillId), 0) + " 枚";
  }
  return "";
}

function caveMetaTone(entry) {
  if (entry.view === "partner") {
    const bonded = Array.isArray(state.partner) ? state.partner.length : 0;
    return bonded > 0 ? "done" : "active";
  }
  if (entry.view === "bag") {
    const worn = EQUIP_SLOT_ORDER.filter((slot) => state.equipIds[slot]).length;
    return worn === EQUIP_SLOT_ORDER.length ? "done" : "";
  }
  return "";
}

    : "可同时羁绊最多5位道侣，每位带来独立修行加成；已结缘的道侣可随时解除。转世重修时道侣相随，加成仍在。";

// 结缘：最多可同时羁绊5位道侣，加成由配置表累加
function meetPartner(partnerId) {
  const partner = PARTNERS[partnerId];
  if (!partner) return;
  if (!Array.isArray(state.partner)) state.partner = [];
  if (state.partner.length >= 5) {
    showToast("已羁绊5位道侣，无法再结");
    return;
  }
  if (state.partner.indexOf(partnerId) >= 0) {
    showToast("已与" + partner.name + "结缘");
    return;
  }
  state.partner.push(partnerId);
  addHistory("与" + partner.name + "结为道侣，修行速度 ×" + (1 + partner.rate).toFixed(2) + "。", "info");
  saveState();
  showToast("与" + partner.name + "结为道侣");
  renderPartner();
  renderCave();
  render();
}

// 解除结缘
function unmeetPartner(partnerId) {
  if (!Array.isArray(state.partner)) return;
  const idx = state.partner.indexOf(partnerId);
  if (idx < 0) return;
  state.partner.splice(idx, 1);
  const partner = PARTNERS[partnerId];
  addHistory("与" + partner.name + "解除道侣关系。", "info");
  saveState();
  showToast("与" + partner.name + "解除道侣关系");
  renderPartner();
  renderCave();
  render();
}

function bonusText(piece) {
  const parts = [];
  if (piece.atk) parts.push("攻 +" + piece.atk);
  if (piece.def) parts.push("防 +" + piece.def);
  if (piece.hp) parts.push("血 +" + piece.hp);
  return parts.length > 0 ? parts.join(" · ") : "无加成";
}

// 未持有就先买下，再祭起；买过则直接换祭
function useTreasure(treasureId) {
  const treasure = TREASURES[treasureId];
  if (!treasure || state.stage < treasure.minStage) return;
  const owned = state.treasures.indexOf(treasureId) >= 0;
  if (!owned) {
    if (state.stones < treasure.price) {
      showToast("灵石不足，先去坊市攒些");
      return;
    }
    state.stones -= treasure.price;
    state.treasures.push(treasureId);
  }
  state.treasureId = treasureId;
  addHistory("祭起" + treasure.name + "，" + bonusText(treasure) + "。", "info");
  saveState();
  showToast("祭起" + treasure.name);
  renderBag();
  renderCave();
  render();
}

// 戒指只有一个物品池，要靠这一格决定戴左手还是右手：先占空位，两只都满就换第一只
function equipTargetSlot(piece) {
  if (piece.slot !== "ring") return EQUIP_POOL_BY_SLOT[piece.slot] || piece.slot;
  if (!state.equipIds.ring1) return "ring1";
  if (!state.equipIds.ring2) return "ring2";
  if (state.equipIds.ring1 === piece.id) return "ring1";
  if (state.equipIds.ring2 === piece.id) return "ring2";
  return "ring1";
}

// 换穿：只认已经到手的东西，没打过的一律穿不上
function wearEquip(slot, itemId) {
  const piece = equipItemById(slot, itemId);
  if (!piece || state.equips.indexOf(itemId) < 0) return;
  // 同一只戒指不能同时占两只手
  if (piece.slot === "ring") {
    const other = slot === "ring1" ? "ring2" : "ring1";
    if (state.equipIds[other] === itemId) {
      showToast("另一只手上正戴着一枚同样的戒指");
      return;
    }
  }
  state.equipIds[slot] = itemId;
  addHistory("换上" + piece.name + "（" + EQUIP_SLOTS[slot] + "），" + bonusText(piece) + "。", "info");
  saveState();
  showToast("换上" + piece.name);
  renderBag();
  renderCave();
  render();
}

function renderBagEquip() {
  const wornCount = EQUIP_SLOT_ORDER.filter((slot) => state.equipIds[slot]).length;
  el.bagEquipArea.innerHTML = "";

  // 上半：身上穿着的那一套，八格固定排好，缺哪格一眼看得见
  el.bagEquipArea.appendChild(makeBagSectionTitle("已穿", wornCount + "/" + EQUIP_SLOT_ORDER.length + " 格"));
  const wornGrid = document.createElement("div");
  wornGrid.className = "bag-grid";
  el.bagEquipArea.appendChild(wornGrid);

  EQUIP_SLOT_ORDER.forEach((slot) => {
    const piece = equipItemById(slot, state.equipIds[slot]);
    appendBagCard({
      top: EQUIP_SLOTS[slot],
      icon: EQUIP_POOL_BY_SLOT[slot],
      name: piece ? piece.name : "空",
      rarity: piece ? piece.rarity : null,
      sub: piece ? piece.rarityName + " · " + dungeonTierLabel(piece.tier) : "尚无",
      foot: piece ? bonusText(piece) : "去历练里打一件",
      footOn: Boolean(piece),
      empty: !piece,
      disabled: true
    }, wornGrid);
  });

  // 下半：背包里的全部藏品，满 120 格就装不下，掉落化尘
  const owned = state.equips
    .map((id) => equipItemById(String(id).split("-")[0], id))
    .filter((piece) => piece !== null)
    .sort((left, right) => (EQUIP_ITEM_SLOTS.indexOf(left.slot) - EQUIP_ITEM_SLOTS.indexOf(right.slot))
      || (right.tier - left.tier)
      || (RARITY_BY_KEY[right.rarity].weight > RARITY_BY_KEY[left.rarity].weight ? -1 : 1));

  el.bagEquipArea.appendChild(makeBagSectionTitle("背包",
    owned.length + "/" + BAG_CAPACITY + " 格 · 满包掉落化尘"));

  const storeGrid = document.createElement("div");
  storeGrid.className = "bag-grid";
  el.bagEquipArea.appendChild(storeGrid);

  if (owned.length === 0) {
    appendBagCard({ top: "藏品", name: "空空如也", sub: "去历练里打一件回来", foot: "去历练", empty: true, disabled: true }, storeGrid);
  } else {
    owned.forEach((piece) => {
      const target = equipTargetSlot(piece);
      const isWorn = EQUIP_SLOT_ORDER.some((slot) => state.equipIds[slot] === piece.id);
      appendBagCard({
        top: EQUIP_SLOTS[target] + " · " + piece.rarityName,
        icon: piece.slot,
        name: piece.name,
        rarity: piece.rarity,
        sub: dungeonTierLabel(piece.tier) + " · " + bonusText(piece),
        foot: isWorn ? "已穿戴" : "换上",
        footOn: isWorn,
        disabled: isWorn,
        onClick: () => wearEquip(target, piece.id)
      }, storeGrid);
    });
  }

  // 风景卡上的字随身上这一套走
  if (el.bagSceneWorn) el.bagSceneWorn.textContent = "已穿 " + wornCount + "/" + EQUIP_SLOT_ORDER.length;
  if (el.bagScenePower) el.bagScenePower.textContent = "战力 " + formatNumber(playerPower());
  if (el.bagSceneStore) el.bagSceneStore.textContent = "背包 " + state.equips.length + "/" + BAG_CAPACITY + " 格";
}

function renderBagTreasure() {
  TREASURE_ORDER.forEach((treasureId) => {
    const treasure = TREASURES[treasureId];
    const owned = state.treasures.indexOf(treasureId) >= 0;
    const isActive = state.treasureId === treasureId;
    const locked = state.stage < treasure.minStage;
    appendBagCard({
      top: "法宝",
      name: treasure.name,

      foot: isActive ? "已祭" : locked ? "需 " + STAGES[treasure.minStage].name
        : owned ? "祭起此宝" : "请回 · " + treasure.price + " 灵石",
      footOn: isActive,
      disabled: isActive || locked || (!owned && state.stones < treasure.price),

    });

// 阶高优先、同阶品级高优先：拿它判断哪件更值得穿
function isPieceBetter(candidate, current) {
  if (!current) return true;
  if (candidate.tier !== current.tier) return candidate.tier > current.tier;
  return RARITY_BY_KEY[candidate.rarity].weight < RARITY_BY_KEY[current.rarity].weight;
}

function bestOwnedOfSlot(slotKey) {
  return state.equips
    .filter((id) => String(id).indexOf(slotKey + "-") === 0)
    .map((id) => equipItemById(slotKey, id))
    .filter((piece) => piece !== null)
    .sort((left, right) => (right.tier - left.tier)
      || (RARITY_BY_KEY[right.rarity].weight > RARITY_BY_KEY[left.rarity].weight ? -1 : 1));
}

// 一键换装：逐部位挑库存里最好的一件换上，戒指两只各取一枚
function autoEquipBest() {
  let changed = 0;
  EQUIP_ITEM_SLOTS.forEach((slotKey) => {
    if (slotKey === "ring") return;
    const best = bestOwnedOfSlot(slotKey)[0];
    const target = EQUIP_POOL_BY_SLOT[slotKey];
    if (!best || target !== slotKey) return;
    if (isPieceBetter(best, equipItemById(target, state.equipIds[target]))) {
      state.equipIds[target] = best.id;
      changed += 1;
    }
  });

  // 戒指单独处理：取最好的两枚，分别顶到两只手上
  const rings = bestOwnedOfSlot("ring");
  ["ring1", "ring2"].forEach((slot, index) => {
    const best = rings[index];
    if (!best) return;
    if (isPieceBetter(best, equipItemById(slot, state.equipIds[slot]))) {
      state.equipIds[slot] = best.id;
      changed += 1;
    }
  });

  if (changed === 0) {
    showToast("身上已是最好的一套");
    return;
  }
  addHistory("一键换装，换上 " + changed + " 件。", "info");
  saveState();
  showToast("换上 " + changed + " 件");
  renderBag();
  renderCave();
  render();
}

// 三卷共用一格网格，切页签只是换内容
function renderBag() {
  if (!el.bagGrid) return;
  el.bagGrid.innerHTML = "";
  if (ui.bagTab === "pills") renderBagPills();
  else if (ui.bagTab === "treasure") renderBagTreasure();
  else renderBagEquip();

  Array.from(document.querySelectorAll(".bag-tab")).forEach((btn) => {
    const isActive = btn.dataset.bag === ui.bagTab;
    btn.dataset.active = String(isActive);
    btn.setAttribute("aria-selected", String(isActive));
  });

/* =========================================================================
   七-3、开局页：取名、性别、灵根（灵根随机，可无限刷新）
   ========================================================================= */
function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// 在品阶的资质区间内，给组内每个属性各抽一个分数
function rollWithGrade(elementKeys, grade) {
  const range = GRADE_QUALITY[grade];
  const elements = elementKeys.map((key) => ({
    key,
    quality: randomInt(range[0], range[1])
  }));
  const total = elements.reduce((sum, item) => sum + item.quality, 0);
  return { elements, quality: Math.round(total / elements.length) };
}

function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = randomInt(0, i);
    const temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

// 抽一副灵根：先决定走混沌 / 变异 / 纯五行哪条路，再把属性和资质一次抽定
function pickRootRoll() {
  const dice = Math.random();

  if (dice < CHAOS_CHANCE) {
    return rollWithGrade(["混沌"], "混沌灵根");
  }

  if (dice < CHAOS_CHANCE + VARIANT_ALONE_CHANCE) {
    const variant = VARIANT_ELEMENTS[randomInt(0, VARIANT_ELEMENTS.length - 1)];
    return rollWithGrade([variant], "变异灵根");
  }

  if (dice < CHAOS_CHANCE + VARIANT_ALONE_CHANCE + VARIANT_MIX_CHANCE) {
    const variant = VARIANT_ELEMENTS[randomInt(0, VARIANT_ELEMENTS.length - 1)];
    const five = FIVE_ELEMENTS[randomInt(0, FIVE_ELEMENTS.length - 1)];
    return rollWithGrade([variant, five], "变异灵根");
  }

  // 纯五行：先抽这一次出现几个属性，再从不重复的五行里取
  const totalWeight = FIVE_COUNT_WEIGHTS.reduce((sum, item) => sum + item.weight, 0);
  let rest = Math.random() * totalWeight;
  let count = FIVE_COUNT_WEIGHTS[FIVE_COUNT_WEIGHTS.length - 1].count;
  for (const item of FIVE_COUNT_WEIGHTS) {
    rest -= item.weight;
    if (rest <= 0) {
      count = item.count;
      break;
    }
  }

  const picked = shuffle(FIVE_ELEMENTS).slice(0, count);
  return rollWithGrade(picked, rootGrade(picked));
}

function rollSpiritRoot(countAsReroll) {
  const roll = pickRootRoll();
  state.rootElements = roll.elements;
  state.rootQuality = roll.quality;
  if (countAsReroll) state.rootRolls += 1;
  return roll;
}

function renderStart() {
  // 第一次进开局页时先随机一副灵根，免得玩家面对空白

// 参悟并改修一本功法：境界不够就拒绝，同一本不重复改修
function equipTech(techId) {
  const tech = TECHS.find((item) => item.id === techId);
  if (!tech) return;
  if (state.stage < tech.unlockStageId) {
    showToast("境界不足，需至" + STAGES[tech.unlockStageId].name + "方可参悟此功法");
    return;
  }
  if (state.techId === tech.id) return;

  state.techId = tech.id;
  addLog("改修《" + tech.name + "》，行气路径为之一变。", "good");
  showToast("已主修《" + tech.name + "》");
  saveState();
  render();
}

function tryBreakthrough() {
  const stage = currentStage();
  const need = stage.need;
  if (need === null) return;
  if (state.cultivation < need) {
    showToast("修为还不够，先积累到 " + formatNumber(need));
    return;
  }

  const success = Math.random() < effectiveRate();
  state.breakBonus = 0;   // 破境丹用一次就散，不论成败

  if (success) {
    state.cultivation -= need;
    const rewardStones = STONE_PER_BREAKTHROUGH + stage.id * STONE_PER_STAGE;
    state.stones += rewardStones;
    state.stage = Math.min(state.stage + 1, LAST_STAGE_ID);
    state.attack += stage.bonus.atk;
    state.defense += stage.bonus.def;
    state.hp += stage.bonus.hp;

    const newStage = currentStage();
    if (stage.isTrial) {
      addLog("九霄雷云散去，劫数已成。你踏入" + newStage.name + "。", "good");
      addHistory("渡劫成功，自" + stage.name + "破入" + newStage.name + "。", "good");
    } else {
      addLog("突破成功，晋升" + newStage.name + "。", "good");
      addHistory("自" + stage.name + "突破至" + newStage.name + "，成。", "good");
    }
    addLog("突破得灵石 " + formatNumber(rewardStones) + "。", "info");
    showToast("突破成功：" + newStage.name + "，得灵石 " + rewardStones);
  } else {
    const lost = Math.round(need * stage.lossRatio);
    state.cultivation = Math.max(0, state.cultivation - lost);

    if (stage.isTrial) {
      const fallbackId = Math.max(0, state.stage - stage.fallbackStages);
      const fallbackName = STAGES[fallbackId].name;
      state.stage = fallbackId;
      addLog("天劫反噬，道基受损，境界跌回" + fallbackName + "。", "bad");
      addHistory("冲击" + STAGES[Math.min(stage.id + 1, LAST_STAGE_ID)].name
        + "时天劫反噬，败，境界跌回" + fallbackName + "。", "bad");
      showToast("渡劫失败，跌落至" + fallbackName);
    } else {
      addLog("突破失败，灵气溃散，折损 " + formatNumber(lost) + " 修为。", "bad");
      addHistory("冲击" + STAGES[Math.min(stage.id + 1, LAST_STAGE_ID)].name
        + "未成，败，折损 " + formatNumber(lost) + " 修为。", "bad");
      showToast("突破失败，损失 " + formatNumber(lost) + " 修为");
    }
  }

  saveState();
  render();
}

function injectCultivation() {
  const stage = currentStage();
  if (stage.need === null) {
    showToast("已至最高境界，无需再注入");
    return;
  }
  const amount = Math.max(1, Math.round(stage.need * 0.8));
  state.cultivation += amount;
  addLog("注入修为（体验）+ " + formatNumber(amount) + "。", "info");
  render();
}

/* =========================================================================
   八-2、商店、丹药、轮回
   ========================================================================= */
function pillCount(pillId) {
  const count = state.pills[pillId];
  return typeof count === "number" ? count : 0;
}

function buyPill(pillId) {
  const pill = PILLS[pillId];
  if (!pill) return;
  if (state.stones < pill.price) {
    showToast("灵石不够，还差 " + formatNumber(pill.price - state.stones) + " 枚");
    return;
  }
  state.stones -= pill.price;
  state.pills[pillId] = pillCount(pillId) + 1;
  showToast("买下一枚" + pill.name);
  saveState();
  renderShop();
  renderBag();
}

function usePill(pillId) {
  const pill = PILLS[pillId];
  if (!pill) return;
  if (pillCount(pillId) <= 0) {
    showToast("丹房里没有这味丹药了，先去坊市买");
    return;
  }

  const stage = currentStage();

  if (pill.use === "instantGain") {
    if (stage.need === null) {
      showToast("已至最高境界，服丹无用");
      return;
    }
    const amount = Math.max(1, Math.round(stage.need * PILL_INSTANT_RATIO));
    state.cultivation += amount;
    addLog("服下" + pill.name + "，修为 +" + formatNumber(amount) + "。", "good");
  }

  if (pill.use === "breakBonus") {
    if (stage.need === null) {
      showToast("已至最高境界，破境丹无用");
      return;
    }
    state.breakBonus += PILL_BREAK_BONUS;
  }

  if (pill.use === "speedBuff") {
    const base = Math.max(Date.now(), state.speedUntil);
    state.speedUntil = base + SPEED_BUFF_MS;
  }

  state.pills[pillId] = pillCount(pillId) - 1;
  addHistory("服下" + pill.name + "。", "info");
  showToast("服下" + pill.name);
  saveState();
  renderShop();
  renderBag();
  render();
}

// 转世：清空境界修为与属性，保留灵石、丹药与灵根，换来永久加成
function doRebirth() {
  if (state.stage < REBIRTH_MIN_STAGE) {
    showToast("修为尚浅，至少到" + STAGES[REBIRTH_MIN_STAGE].name + "方可转世");
    return;
  }
  const confirmed = window.confirm(
    "转世将散尽此身修为，境界重回" + STAGES[0].name + "，并永久提高修行速度。确定吗？"
  );
  if (!confirmed) return;

  const oldStageName = currentStage().name;
  state.rebirths += 1;
  state.stage = 0;
  state.cultivation = 0;
  state.attack = BASE_ATTACK;
  state.defense = BASE_DEFENSE;
  state.hp = BASE_HP;
  state.techId = null;
  state.breakBonus = 0;
  state.speedUntil = 0;

  const gainText = "第 " + state.rebirths + " 世，永久修行速度 +"
    + formatPercent(REBIRTH_BONUS_PER_LIFE * state.rebirths);
  addLog("自" + oldStageName + "转世重修。" + gainText, "good");
  addHistory("于" + oldStageName + "坐化转世，此为第 " + state.rebirths + " 世。" + gainText, "start");
  lastTickAt = Date.now();
  saveState();
  showToast("已入第 " + state.rebirths + " 世");
  render();
  renderRebirth();
}

/* =========================================================================
   九、时间结算：用真实经过的毫秒算，而不是“每跳一次加一点”
   这样即使浏览器切到后台、结算被延迟，修为也不会漏算或暴涨
   ========================================================================= */
let lastTickAt = Date.now();
let lastSaveAt = Date.now();

function tick() {
  const now = Date.now();
  const elapsedSeconds = (now - lastTickAt) / 1000;
  lastTickAt = now;

  // 还没入道的停在开局页，不结算也不重绘
  if (!state.started) return;

  if (state.meditating) {
    state.cultivation += gainPerSecond() * elapsedSeconds;
  }

  if (now - lastSaveAt >= AUTO_SAVE_MS) {
    saveState();
    lastSaveAt = now;
  }

  render();
}

function saveState() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch (error) {
    console.error("保存存档失败", error);
  }
}

function resetGame() {
  const confirmed = window.confirm("重开会清空当前道号、灵根与全部进度，重新开局。确定吗？");
  if (!confirmed) return;
  state = createInitialState();
  ui.techRenderKey = "";
  ui.dungeonKey = "";
  ui.rebirthKey = "";
  ui.caveKey = "";
  ui.attrKey = "";
  el.nameInput.value = "";
  saveState();
  window.location.hash = "";
  showView("start");
  render();
}

function viewFromHash() {
  const hash = window.location.hash;
  if (hash === HASH_BY_VIEW.partner) return "partner";
  if (hash === HASH_BY_VIEW.attr) return "attr";
  if (hash === HASH_BY_VIEW.cultivation) return "cultivation";
  if (hash === HASH_BY_VIEW.techniques) return "techniques";
  if (hash === HASH_BY_VIEW.history) return "history";
  if (hash === HASH_BY_VIEW.shop) return "shop";
  if (hash === HASH_BY_VIEW.bag) return "bag";
  if (hash === HASH_BY_VIEW.rebirth) return "rebirth";
  return "cave";
}

function showView(viewName) {
  Object.keys(VIEWS).forEach((key) => {
    VIEWS[key].hidden = key !== viewName;
  });
  // 开局页没有导航栏与状态条，入道后才出现
  el.navBar.hidden = viewName === "start";
  el.topBar.hidden = viewName === "start";
  // 从洞府进去的子页面，底部导航也让「洞府」保持选中，不让人以为走丢了
  const caveSubViews = ["partner", "shop", "bag"];
  NAV_BUTTONS.forEach((btn) => {
    const isActive = btn.dataset.view === viewName
      || (btn.dataset.view === "cave" && caveSubViews.indexOf(viewName) >= 0);
    btn.dataset.active = String(isActive);
    btn.setAttribute("aria-selected", String(isActive));
  });
  if (viewName === "cave") renderCave();
  if (viewName === "partner") renderPartner();
  if (viewName === "attr") renderAttr();
  if (viewName === "techniques") renderTechs();
  if (viewName === "history") renderDungeon();
  if (viewName === "shop") renderShop();
  if (viewName === "bag") renderBag();
  if (viewName === "rebirth") renderRebirth();
  if (viewName === "start") renderStart();
}

NAV_BUTTONS.forEach((btn) => {
  btn.addEventListener("click", () => {
    if (viewFromHash() === btn.dataset.view) {
      showView(btn.dataset.view);
      return;
    }
    window.location.hash = HASH_BY_VIEW[btn.dataset.view];
  });
});

window.addEventListener("hashchange", () => {
  // 还没入道时，任何 hash 都留在开局页
  if (!state.started) {
    showView("start");
    return;
  }
  showView(viewFromHash());
});

showView(state.started ? viewFromHash() : "start");
render();
window.setInterval(tick, ACCRUE_TICK_MS);

el.meditateBtn.addEventListener("click", toggleMeditating);
el.breakBtn.addEventListener("click", tryBreakthrough);
el.injectBtn.addEventListener("click", injectCultivation);
el.rebirthBtn.addEventListener("click", doRebirth);
el.startBtn.addEventListener("click", beginCultivation);
el.rerollBtn.addEventListener("click", rerollSpiritRoot);

el.autoEquipBtn.addEventListener("click", autoEquipBest);

// 背包三个页签只换内容不换页面，切完立刻重画
Array.from(document.querySelectorAll(".bag-tab")).forEach((btn) => {
  btn.addEventListener("click", () => {
    ui.bagTab = btn.dataset.bag;
    renderBag();
  });
});

Array.from(document.querySelectorAll("[data-back]")).forEach((btn) => {
  btn.addEventListener("click", () => {
    window.location.hash = HASH_BY_VIEW[btn.dataset.back];
    showView(btn.dataset.back);
  });
});

Array.from(el.genderRow.querySelectorAll(".choice")).forEach((btn) => {
  btn.addEventListener("click", () => {
    ui.gender = btn.dataset.gender;
    renderStart();
  });
});

// 关页面前再存一次，避免刚突破的进度丢掉
window.addEventListener("beforeunload", saveState);
</script>
</body>
</html>
